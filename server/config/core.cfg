# ── Environment ───────────────────────────────────────────────────────────────
set sv_environment  prod  # dev | prod | test
set sv_access_role  0
setr sbfw_version   2.0.0

# ── Logging ───────────────────────────────────────────────────────────────────
# 1 trace  ·  2 info  ·  3 warn  ·  4 error  ·  5 critical
setr log_level 2

# ── Discord ───────────────────────────────────────────────────────────────────
setr discord_app ""

# ── Chat ──────────────────────────────────────────────────────────────────────
set  chat_showQuits 0
set  chat_showJoins 0
sets motd           "Welcome to Strata Framework!"

# ── Gameplay ──────────────────────────────────────────────────────────────────
set casino_open true

setr game_enableFlyThroughWindscreen     true
setr game_enablePlayerJumpRagdollControl true
setr game_enablePlayerRagdollOnCollision true
setr sv_showBusySpinnerOnLoadingScreen   false

setr profile_skfx            0
setr profile_gfxCityDensity  0
setr profile_gfxPopVariety   0
setr profile_fpsFieldOfView  10

# ── Dev ───────────────────────────────────────────────────────────────────────
# WARNING: must be 0 in production — grants every player admin access
set danger_everyone_is_admin 1

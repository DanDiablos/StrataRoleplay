# ──────────────────────────────────────────────────────────────────────────────
#   STRATA  ·  server.prod.cfg
# ──────────────────────────────────────────────────────────────────────────────

# ── Network ───────────────────────────────────────────────────────────────────
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# ── Identity ──────────────────────────────────────────────────────────────────
sv_hostname        "Strata Framework"
sv_maxclients      2  # requires CFX Patreon licence for >10 players

sets sv_projectName "Strata Framework"
sets sv_projectDesc "An advanced FiveM RP framework including jobs, gangs, housing & more!"
sets locale         "en-US"
sets tags           "housing, gangs, robberies, drugs, custom cars, custom clothing, pd, ems, racing"
sets discord        ""
sets website        ""

# ── Branding ──────────────────────────────────────────────────────────────────
 load_server_icon logo.png
 sets banner_detail     "https://cdn.discordapp.com/attachments/1486451512791011390/1489845118625255484/e21e5ad2-bd31-4da1-84ea-ef0cff2aae56.png?ex=69d5da64&is=69d488e4&hm=abe6add4ee695922ef9087e77cfab796ab2b09861d5479525a84b260a70d00ca&"
 sets banner_connecting "https://cdn.discordapp.com/attachments/1486451512791011390/1489845118625255484/e21e5ad2-bd31-4da1-84ea-ef0cff2aae56.png?ex=69d5da64&is=69d488e4&hm=abe6add4ee695922ef9087e77cfab796ab2b09861d5479525a84b260a70d00ca&"

# ── Security ──────────────────────────────────────────────────────────────────
sv_endpointPrivacy  true
set screencapture_use_nui_callback true
sv_scriptHookAllowed 0
sv_master1 ""  # comment out to list publicly

# ── Game ──────────────────────────────────────────────────────────────────────
set sv_enforceGameBuild 3407
# sets sv_pureLevel 1

# ── Misc ──────────────────────────────────────────────────────────────────────
set winter_only    "false"
set WS_MDT_ALERTS  "http://localhost:4002/mdt-alerts"

# ── Configs ───────────────────────────────────────────────────────────────────
# secrets first — values here override anything set above
exec ./config/secrets.cfg
exec ./config/database.cfg
exec ./config/core.cfg
exec ./config/permissions.cfg
exec ./config/voice.cfg
exec ./config/webhooks.cfg
exec ./config/ox.cfg
exec ./config/resources.cfg
